profile_id: dtsu666
name: Chint DTSU666 / DSSU666
description: 'Imported/adapted from modbus_meter_bridge config/driver_profiles/chint_dtsu666_draft.yaml. Source profile id
  was chint_dtsu666_draft. Refined DTSU666 profile based on uploaded Chint manuals. Requires validation against exact variant
  and wiring mode. RS485 Modbus RTU. Read command is 03H. Write command is 10H. Factory Modbus parameters may be 9600 bps,
  N.1, address 1 depending on variant/customization. Electrical data table uses hexadecimal addresses. Single-precision floating
  point uses IEEE754. Float order is ABCD, high byte first. Some communication values are secondary-side values and may require
  CT/PT ratio handling. Profile is refined from manual but not validated against hardware. Address values below are decimal
  equivalents of documented hexadecimal addresses. Manual labels some values as secondary-side data. CT/PT ratio handling
  may be needed later. {''Scale follows table hints'': ''V x0.1, A x0.001, W/var x0.1, PF x0.001, Hz x0.01, kWh to Wh x1000.''}
  Depending on actual protocol implementation, scale may need to be set to 1 if the meter already returns engineering units.'
status: partial_imported_from_bridge
default_function: 3
byte_order: big
word_order: normal
base_addressing: zero_based
registers_per_value: 2
max_registers_per_request: 80
