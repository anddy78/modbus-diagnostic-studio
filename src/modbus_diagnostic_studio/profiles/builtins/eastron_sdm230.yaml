profile_id: eastron_sdm230
name: Eastron SDM230
description: Imported/adapted from modbus_meter_bridge config/driver_profiles/eastron_sdm230_draft.yaml. Source profile id
  was eastron_sdm230_draft. Refined SDM230 profile based on uploaded Modbus manual. Still requires validation against real
  meter. RS485 Modbus RTU. Input registers are read with FC04. Values are IEEE754 float32. Each value uses 2 consecutive 16-bit
  registers. Most significant register first. Requests must use an even number of registers. Maximum recommended request size
  is 40 values / 80 registers. Profile is refined from manual but not validated against hardware. Power values are W/VA/var
  directly. Energy values are documented in kWh/kvarh and converted to Wh/varh by scale 1000. Single-phase meter values are
  mapped to L1 and total where applicable.
status: partial_imported_from_bridge
default_function: 4
byte_order: big
word_order: normal
base_addressing: zero_based
registers_per_value: 2
max_registers_per_request: 80
