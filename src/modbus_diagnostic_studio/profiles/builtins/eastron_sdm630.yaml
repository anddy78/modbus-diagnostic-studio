profile_id: eastron_sdm630
name: Eastron SDM630 Modbus V2
description: Imported/adapted from modbus_meter_bridge config/driver_profiles/eastron_sdm630_draft.yaml. Source profile id
  was eastron_sdm630_draft. Refined SDM630 profile based on uploaded SDM630 Modbus manual. Still requires validation against
  real meter. RS485 Modbus RTU. Input registers are read with FC04. Values are IEEE754 float32. Each value uses 2 consecutive
  16-bit registers. Most significant register first by default. Register order can be changed in meter settings, so word_order
  may need to be swapped in field. Maximum transaction is 40 values / 80 registers. Baudrates include 2400, 4800, 9600, 19200,
  38400 and 115200 depending on document section/version. Profile is refined from manual but not validated against hardware.
  Power values are W/VA/var directly. Energy values are documented in kWh/kvarh and converted to Wh/varh by scale 1000. Some
  variables may return zero depending on wiring mode 1P2W/3P3W/3P4W.
status: partial_imported_from_bridge
default_function: 4
byte_order: big
word_order: normal
base_addressing: zero_based
registers_per_value: 2
max_registers_per_request: 80
