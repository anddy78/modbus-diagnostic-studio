profile_id: janitza_umg604
name: Janitza UMG604 / UMG604-Pro
description: Imported/adapted from modbus_meter_bridge config/driver_profiles/janitza_umg604.yaml. Source status was validated_for_virtual_output.
  Main frequently required readings block used by Huawei SmartLogger Janitza profile. Huawei SmartLogger was observed reading
  FC03 address 19000 quantity 110. Values are IEEE754 float32, 2 Modbus registers per variable. This profile is used as virtual
  output map.
