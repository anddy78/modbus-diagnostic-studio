profile_id: chint_dtsu71
name: Chint DTSU71
description: Imported/adapted from modbus_meter_bridge config/driver_profiles/chint_dtsu71.yaml. Observed Chint DTSU71 profile
  from Huawei SmartLogger Modbus RTU captures. Preliminary map, validated against field sniffer data. Huawei SmartLogger configured
  as DTSU71 queried slave 11 using FC03. Fast block observed as FC03 address 2102 quantity 42. Slow energy block observed
  as FC03 address 2158 quantity 66. Values are IEEE754 float32. Each value uses 2 consecutive 16-bit registers. Most significant
  register first. First energy group 2158..2180 is classified with good confidence from import/export/limited export field
  captures. This profile is preliminary and observed, not yet confirmed against an official Chint register manual. Instantaneous
  block 2102..2142 maps current, voltage, frequency, P, Q and S. Energy block 2158..2180 maps active net/import/export total
  and phases with good confidence. Auxiliary block 2182..2222 is intentionally not included until officially identified.
status: observed_from_huawei_smartlogger
default_function: 3
byte_order: big
word_order: normal
base_addressing: zero_based
registers_per_value: 2
max_registers_per_request: 66
